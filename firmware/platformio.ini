[env:mono-note-mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    ; GCC 14.2 ICEs compiling main.cpp - try_forward_edges, cfgcleanup.cc:580 -
    ; on the large switch in loop(). It is a compiler bug, not bad code: it
    ; moves between functions as the file is edited and survives clean builds.
    ; -fno-crossjumping held it off for a while and stopped being enough as the
    ; switch grew, so the optimisation level moves instead. -O2 costs some
    ; flash on a build using 40% of 3.3MB, which is a trade worth making
    ; against a compiler that cannot finish.
    ; try_forward_edges is reached from cleanup_cfg, which several passes call.
    ; Disabling them individually chased the crash from main.cpp into
    ; pala_net.cpp and left it nondeterministic - the same source would build
    ; on a retry. These are the passes that reach it.
    -fno-crossjumping
    -fno-thread-jumps
    -fno-tree-tail-merge
    -O2
build_unflags = -Os
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

