[env:mono-note-mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Waveshare ESP32-S3-Touch-AMOLED-2.16: an ESP32-S3R8, so 8MB octal PSRAM, and
; 16MB of quad flash. The board before this one had 8MB of flash, and a
; partition table sized for the wrong chip boots in a loop rather than failing
; in any way that says so.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    ; GCC 14.2 ICEs compiling main.cpp - try_forward_edges, cfgcleanup.cc:580.
    ; It is a compiler bug, not bad code: it moves between functions as the
    ; file is edited and survives clean builds. try_forward_edges is reached
    ; from cleanup_cfg, which several passes call; these are the passes that
    ; reach it. Nondeterministic, so a failed build is often worth retrying
    ; before believing it.
    -fno-crossjumping
    -fno-thread-jumps
    -fno-tree-tail-merge
    -O2
build_unflags = -Os

lib_deps =
    ; The display is a CO5300 on a quad-SPI bus. Arduino_GFX has both the panel
    ; driver and the ESP32 QSPI bus, and is what Waveshare's own examples use.
    moononournation/GFX Library for Arduino@^1.6.7
    ; CST9220 touch, via the CST92xx driver. Same library Waveshare ship.
    lewisxhe/SensorLib@^0.4.1
    ; AXP2101 power management: battery percentage, charge state, rail control.
    lewisxhe/XPowersLib@^0.3.3
